# Smritidb — release artifact build (scaffold).
#
# Triggered on tag pushes matching `v*` (e.g. v0.1.0, v0.2.0-rc1). Builds
# distributable artifacts for every binding and uploads them to the GitHub
# Release. Publish-to-registry steps (PyPI, npm, Maven Central, NuGet) are
# intentionally NOT included — those require secrets that are not yet set up
# on this repo. Add them in a follow-up once the publish identities exist.
#
# Deferred / not yet wired:
#   - Apple iOS xcframework packaging (needs cinterop-driven build).
#   - Windows runner for rusqlite + JNA (historical pitfalls; see CI.md).
#   - Signed Maven Central upload (needs GPG key + Sonatype credentials).
#   - NuGet pack for smritidb-dotnet (binding ships in a future phase).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Python wheels — manylinux + macOS (arm64 + x86_64) + Windows abi3 wheel.
  # Uses maturin-action which knows how to set up zig + the right manylinux
  # image. Output wheels land in dist/ as artifacts.
  # ---------------------------------------------------------------------------
  python-wheels:
    name: Python wheels (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-hosted only — org policy 2026-09-11: no workflow in any
          # Tanvrit repo may name a GitHub-hosted image. These five legs were
          # `ubuntu-latest` x2 / `macos-latest` x2 / `windows-latest`.
          #
          # Unlike a jpackage matrix, the host architecture here does NOT have
          # to match `target`: maturin-action cross-compiles (zig + the
          # manylinux image for Linux, the Apple SDK's second slice for
          # Darwin). So `aarch64-unknown-linux-gnu` builds on an X64 host and
          # both Apple targets build on whichever mac is up. The label sets
          # pin OS only, deliberately — pinning arch as well would idle four
          # of the five legs behind two specific machines for no gain.
          - os: linux
            runner: '{"group": "tanvrit", "labels": ["self-hosted", "Linux", "X64"]}'
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: linux
            runner: '{"group": "tanvrit", "labels": ["self-hosted", "Linux", "X64"]}'
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: macos
            runner: '{"group": "tanvrit", "labels": ["self-hosted", "macOS"]}'
            target: aarch64-apple-darwin
            manylinux: auto
          - os: macos
            runner: '{"group": "tanvrit", "labels": ["self-hosted", "macOS"]}'
            target: x86_64-apple-darwin
            manylinux: auto
          - os: windows
            runner: '{"group": "tanvrit", "labels": ["self-hosted", "windows"]}'
            target: x86_64-pc-windows-msvc
            manylinux: auto
    # fromJSON() is required: without it the expression yields a JSON *string*
    # and the object form (`{group, labels}`) is never parsed as a runner spec.
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/smritidb-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: smritidb-py-${{ matrix.target }}
          path: packages/smritidb-py/dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # TypeScript npm package — runs pnpm build and packs a tarball. The actual
  # `npm publish` is left commented; un-comment once the NPM_TOKEN secret is
  # provisioned.
  # ---------------------------------------------------------------------------
  npm-package:
    name: TypeScript npm tarball
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. `packageManager` in the root package.json
      # is the single source of truth for the pnpm version (Corepack reads it, and
      # it governs local dev too). pnpm/action-setup@v4 errors out with "Multiple
      # versions of pnpm specified" if both are present.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - working-directory: packages/core-ts
        run: pnpm build

      - name: Pack tarball
        working-directory: packages/core-ts
        run: pnpm pack --out smritidb-%v.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: smritidb-npm-tarball
          path: packages/core-ts/smritidb-*.tgz
          if-no-files-found: error

      # Publish (deferred — needs NPM_TOKEN secret).
      # - name: npm publish
      #   working-directory: packages/core-ts
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: npm publish --access public --provenance

  # ---------------------------------------------------------------------------
  # KMP — JVM Maven publication. Builds and stages a Maven repo layout via
  # `publishJvmPublicationToMavenLocal`. Real signed upload to Maven Central
  # is deferred (needs GPG + Sonatype credentials).
  #
  # Publishing never runs on ARM64, so this stays on Linux X64 — the "Parmar"
  # host, whose runner1..10 are processes of ONE root user (HOME=/root). Two
  # consequences, both handled below: Gradle gets a per-runner home on the
  # /var/lib/vz pool, not the shared (and nearly full) /root/.gradle; and the
  # publication goes to a job-private Maven repo, not the shared /root/.m2,
  # where other repos' com/tanvrit/ artifacts would have been swept into this
  # upload.
  # ---------------------------------------------------------------------------
  kmp-jvm:
    name: KMP JVM Maven publication
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"

      - name: Build FFI cdylib
        working-directory: packages/smritidb-ffi
        run: cargo build --release

      - name: Stage cdylib for JNA
        working-directory: packages/smritidb-ffi
        run: |
          mkdir -p target/release-jna/linux-x86-64
          cp target/release/libsmritidb_ffi.so target/release-jna/linux-x86-64/

      # Persistent, per-runner Gradle home on the 593 GB pool (falls back
      # under $HOME if the pool is not writable). Never the workspace: checkout
      # wipes it.
      - name: Per-runner GRADLE_USER_HOME
        run: |
          set -euo pipefail
          GUH="/var/lib/vz/ci/gradle-home/$RUNNER_NAME"
          if ! mkdir -p "$GUH" 2>/dev/null || [ ! -w "$GUH" ]; then
            GUH="$HOME/.gradle-ci/$RUNNER_NAME"
            mkdir -p "$GUH"
          fi
          echo "GRADLE_USER_HOME=$GUH" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME host=$(hostname) GRADLE_USER_HOME=$GUH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # ./gradlew, i.e. the wrapper's pinned Gradle (9.7.1). This used to call
      # a bare `gradle`, and the Linux fleet has none.
      - name: Publish to a job-private Maven repo
        working-directory: packages/smritidb-kmp
        run: >-
          ./gradlew publishJvmPublicationToMavenLocal
          "-Dmaven.repo.local=$RUNNER_TEMP/m2"
          --no-daemon --stacktrace

      # github-release attaches only wheels and the npm tarball, so nothing
      # downstream consumes this; an Actions storage-quota error must not fail
      # the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: smritidb-kmp-maven-local
          path: ${{ runner.temp }}/m2/com/tanvrit/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # .NET NuGet — scaffold only. The smritidb-dotnet binding is not yet ready
  # for distribution; this job exists so the structure is in place when it is.
  # ---------------------------------------------------------------------------
  dotnet-nuget:
    name: .NET NuGet (scaffold; skipped)
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    if: false # Flip to true once packages/smritidb-dotnet has a real csproj.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - working-directory: packages/smritidb-dotnet
        run: dotnet pack -c Release -o nupkgs
      - uses: actions/upload-artifact@v4
        with:
          name: smritidb-dotnet-nupkg
          path: packages/smritidb-dotnet/nupkgs/*.nupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release — collects every artifact and attaches it to the release
  # the tag points at. Does NOT push to any external registry.
  # ---------------------------------------------------------------------------
  github-release:
    name: Attach artifacts to GitHub Release
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    needs: [python-wheels, npm-package, kmp-jvm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.whl
            artifacts/**/*.tgz
          generate_release_notes: true
