# Smritidb — bit-exactness conformance gate.
#
# Runs every binding's conformance suite against the SAME `tests/conformance/`
# corpus and asserts the KMF fixture round-trips byte-identically. Triggered
# nightly (so a tooling drift surfaces independently of any commit) and on
# every PR (so contributors cannot land a change that quietly breaks parity).
#
# This is the single most important invariant in the project: a snapshot
# emitted from any binding must be byte-identical to one emitted from any
# other. If this workflow fails, do NOT merge — the conformance contract has
# been broken and downstream KMF blobs in the wild may stop decoding.

name: Conformance

on:
  pull_request:
    branches: [main]
  schedule:
    # 07:00 UTC daily — runs against the latest main even if no PR is open.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Fork-PR guard (2026-09-24): every job below runs on the self-hosted `tanvrit`
  # fleet (the X64 hosts run jobs as root; the ARM64 node is a workstation), so
  # a pull_request from a FORK must never execute on it. Each job carries the
  # same-repo `if:` below; push/schedule/dispatch runs are unaffected. A fork
  # PR therefore shows these checks as skipped, not passed: to test one, push
  # its branch to this repo after review. Org-level approval for outside
  # collaborators' fork-PR workflows is the first layer; this is the second.
  #
  # Self-hosted only — org policy 2026-09-11: no workflow in any Tanvrit repo
  # may name a GitHub-hosted image. Every job below ran on `ubuntu-latest`
  # until then.
  #
  # Label sets name the OS and architecture rather than relying on
  # `group: tanvrit` alone: the group is heterogeneous — ten Linux X64 nodes,
  # one ARM64 Linux node, macs and a Windows box — and an unpinned job in a
  # sibling repo has landed on the wrong OS before.
  # ---------------------------------------------------------------------------
  # Fixture parity. Re-emits the KMF fixture from the TS reference and asserts
  # the bytes match the checked-in `kmf_fixture.bin`. Also guards `golden.json`
  # against silent edits.
  # ---------------------------------------------------------------------------
  fixture-parity:
    name: KMF fixture parity (TS emit -> cmp)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. `packageManager` in the root package.json
      # is the single source of truth for the pnpm version (Corepack reads it, and
      # it governs local dev too). pnpm/action-setup@v4 errors out with "Multiple
      # versions of pnpm specified" if both are present.
      #
      # `dest` is per runner registration. The default, ~/setup-pnpm, is ONE
      # directory for every runner process on the host (they all run as root,
      # HOME=/root), and pnpm/action-setup deletes it before reinstalling. In
      # run 35860816227 THIS job, on runner6, wiped it at 12:29:49.05 while
      # ts-conformance on runner4 sat between its own install (48.99) and
      # setup-node's lookup (49.13): "Unable to locate executable file: pnpm"
      # (job 107180313410). pnpm WAS provisioned — then un-provisioned by a
      # neighbour. The two jobs start together on every trigger (and race
      # ci.yml's pnpm jobs on PRs), so every run is exposed. Suffixing the
      # runner name keeps the directory under $HOME, so pnpm's store location
      # (which depends on whether PNPM_HOME and the checkout share a
      # filesystem) is exactly what it was.
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tests/conformance/golden.json is unchanged
        run: git diff --exit-code -- tests/conformance/golden.json

      - name: Verify tests/conformance/kmf_fixture.bin is unchanged
        run: git diff --exit-code -- tests/conformance/kmf_fixture.bin

      - name: Build core-ts
        run: pnpm --filter @tanvrit/smritidb build

      - name: Re-emit KMF fixture into a sibling path
        run: |
          cp tests/conformance/emit_kmf_fixture.mjs tests/conformance/emit_kmf_fixture.regen.mjs
          sed -i 's|kmf_fixture.bin|kmf_fixture.regen.bin|g; s|kmf_fixture.json|kmf_fixture.regen.json|g' \
            tests/conformance/emit_kmf_fixture.regen.mjs
          node tests/conformance/emit_kmf_fixture.regen.mjs

      - name: cmp regenerated vs checked-in
        run: cmp tests/conformance/kmf_fixture.bin tests/conformance/kmf_fixture.regen.bin

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-parity-failure
          path: |
            tests/conformance/kmf_fixture.bin
            tests/conformance/kmf_fixture.regen.bin
            tests/conformance/kmf_fixture.json
            tests/conformance/kmf_fixture.regen.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # TypeScript conformance — the source of truth for the corpus.
  # tests/conformance.test.ts in core-ts exercises golden.json from inside the
  # tsx test runner.
  # ---------------------------------------------------------------------------
  ts-conformance:
    name: TypeScript — corpus tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. `packageManager` in the root package.json
      # is the single source of truth for the pnpm version (Corepack reads it, and
      # it governs local dev too). pnpm/action-setup@v4 errors out with "Multiple
      # versions of pnpm specified" if both are present. Per-runner `dest`: see
      # fixture-parity — this is the job that lost the race.
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Limit to the corpus + KMF cross-impl tests; we don't need the whole
      # 73-test suite here — that runs in ci.yml.
      - name: Run conformance + KMF cross-impl tests only
        working-directory: packages/core-ts
        run: pnpm exec tsx --test 'src/conformance.test.ts' 'src/kmf.cross-impl.test.ts'

  # ---------------------------------------------------------------------------
  # Rust conformance — the Rust core's `tests/conformance.rs` (8 tests) and
  # `tests/kmf_cross_impl.rs` (2 tests). Both load straight out of
  # tests/conformance/ at the repo root.
  # ---------------------------------------------------------------------------
  rust-conformance:
    name: Rust — corpus + KMF cross-impl
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # `stable`, not the MSRV floor. These jobs run `cargo test` / `cargo build`,
      # which compile DEV-dependencies too — and MSRV is a promise about the
      # library's own dependency graph, not about its benchmark tooling. Pinning
      # the test job to 1.75 conflated the two and made the tree unable to
      # satisfy its own advertised MSRV: the committed Cargo.lock files are
      # format v4 (Cargo 1.78+), and criterion -> clap -> clap_lex 1.1.0 requires
      # the `edition2024` feature, stabilised only in Cargo 1.85. Nothing a
      # consumer of this crate links against needs either.
      #
      # rust-version = "1.75" in the Cargo.toml files is unchanged and remains
      # truthful. If you want it enforced, add a separate job that runs
      # `cargo check --no-dev-deps` (cargo-hack) on 1.75 — that is the check
      # that actually verifies the promise.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/core-rs/target/
          key: cargo-core-rs-${{ runner.os }}-${{ hashFiles('packages/core-rs/Cargo.lock', 'packages/core-rs/Cargo.toml') }}
          restore-keys: |
            cargo-core-rs-${{ runner.os }}-

      - name: cargo test conformance + kmf_cross_impl
        working-directory: packages/core-rs
        run: cargo test --release --test conformance --test kmf_cross_impl

  # ---------------------------------------------------------------------------
  # Python conformance — the pyo3 binding wraps the same Rust core, so the
  # corpus tests in `tests/test_smritidb.py` exercise the binding boundary
  # against the same golden corpus.
  # ---------------------------------------------------------------------------
  py-conformance:
    name: Python — corpus tests (via maturin)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # `stable`, not the MSRV floor. These jobs run `cargo test` / `cargo build`,
      # which compile DEV-dependencies too — and MSRV is a promise about the
      # library's own dependency graph, not about its benchmark tooling. Pinning
      # the test job to 1.75 conflated the two and made the tree unable to
      # satisfy its own advertised MSRV: the committed Cargo.lock files are
      # format v4 (Cargo 1.78+), and criterion -> clap -> clap_lex 1.1.0 requires
      # the `edition2024` feature, stabilised only in Cargo 1.85. Nothing a
      # consumer of this crate links against needs either.
      #
      # rust-version = "1.75" in the Cargo.toml files is unchanged and remains
      # truthful. If you want it enforced, add a separate job that runs
      # `cargo check --no-dev-deps` (cargo-hack) on 1.75 — that is the check
      # that actually verifies the promise.
      - uses: dtolnay/rust-toolchain@stable

      # Python from uv, not actions/setup-python, which ships Ubuntu builds
      # only and failed here with "The version '3.11' with architecture 'x64'
      # was not found for Debian 13" (job 107180313417). Identical to ci.yml's
      # `python` job — the reasoning (why uv, why the SHA pin, why the
      # per-runner UV_PYTHON_INSTALL_DIR) is written out there.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        with:
          version: "0.12.18"

      - name: Provision Python 3.11 venv (uv)
        run: |
          set -euo pipefail
          echo "uv: $(command -v uv) — $(uv --version)"
          uv python install --no-bin 3.11
          uv venv --managed-python --python 3.11 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version; print(sys.executable, sys.version)'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/smritidb-py/target/
          key: cargo-py-${{ runner.os }}-${{ hashFiles('packages/smritidb-py/Cargo.lock', 'packages/smritidb-py/Cargo.toml', 'packages/core-rs/Cargo.toml') }}
          restore-keys: |
            cargo-py-${{ runner.os }}-

      - run: uv pip install "maturin>=1.7,<2.0" pytest

      # Same as ci.yml's `python` job: build the wheel and install it, so the
      # tests import the built extension rather than the source tree.
      - working-directory: packages/smritidb-py
        run: maturin build --release --out dist

      - working-directory: packages/smritidb-py
        run: uv pip install --force-reinstall dist/*.whl

      - working-directory: packages/smritidb-py
        run: pytest -q

  # ---------------------------------------------------------------------------
  # KMP JVM conformance — the JVM binding loads the UniFFI cdylib via JNA.
  # Stages the cdylib under target/release-jna/linux-x86-64/ exactly like the
  # main CI job, then runs :jvmTest.
  # ---------------------------------------------------------------------------
  kmp-conformance:
    name: KMP JVM — corpus tests (via UniFFI)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `stable`, not the MSRV floor. These jobs run `cargo test` / `cargo build`,
      # which compile DEV-dependencies too — and MSRV is a promise about the
      # library's own dependency graph, not about its benchmark tooling. Pinning
      # the test job to 1.75 conflated the two and made the tree unable to
      # satisfy its own advertised MSRV: the committed Cargo.lock files are
      # format v4 (Cargo 1.78+), and criterion -> clap -> clap_lex 1.1.0 requires
      # the `edition2024` feature, stabilised only in Cargo 1.85. Nothing a
      # consumer of this crate links against needs either.
      #
      # rust-version = "1.75" in the Cargo.toml files is unchanged and remains
      # truthful. If you want it enforced, add a separate job that runs
      # `cargo check --no-dev-deps` (cargo-hack) on 1.75 — that is the check
      # that actually verifies the promise.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/smritidb-ffi/target/
          key: cargo-ffi-${{ runner.os }}-${{ hashFiles('packages/smritidb-ffi/Cargo.lock', 'packages/smritidb-ffi/Cargo.toml', 'packages/core-rs/Cargo.toml') }}
          restore-keys: |
            cargo-ffi-${{ runner.os }}-

      - name: Build FFI cdylib
        working-directory: packages/smritidb-ffi
        run: cargo build --release

      - name: Stage cdylib for JNA
        working-directory: packages/smritidb-ffi
        run: |
          mkdir -p target/release-jna/linux-x86-64
          cp target/release/libsmritidb_ffi.so target/release-jna/linux-x86-64/

      # Gradle is the wrapper's pinned version, provisioned by setup-gradle and
      # asserted before use — never whatever `gradle` the host has, which here
      # was none: "gradle: command not found", exit 127 (job 107180313297).
      # Identical to ci.yml's kmp-jvm job, where the reasoning (why not
      # ./gradlew, why a per-runner GRADLE_USER_HOME) is written out.
      - name: Read the Gradle version the wrapper pins
        id: gradle-pin
        run: |
          set -euo pipefail
          V="$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][0-9.]*\)-bin\.zip$#\1#p' packages/smritidb-kmp/gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$V" ]; then
            echo "::error::no -bin distributionUrl in packages/smritidb-kmp/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Isolate GRADLE_USER_HOME per runner
        run: |
          GUH="$RUNNER_WORKSPACE/.gradle-home"
          mkdir -p "$GUH"
          echo "GRADLE_USER_HOME=$GUH" >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME host=$(hostname) GRADLE_USER_HOME=$GUH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-pin.outputs.version }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: gradle :jvmTest
        working-directory: packages/smritidb-kmp
        env:
          WANT: ${{ steps.gradle-pin.outputs.version }}
        run: |
          set -euo pipefail
          HAVE="$(gradle --version 2>/dev/null | awk '/^Gradle /{print $2; exit}' || true)"
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::gradle on PATH ($(command -v gradle || echo none)) is '${HAVE:-missing}', the wrapper pins $WANT"
            exit 1
          fi
          gradle :jvmTest --no-daemon --stacktrace

  # ---------------------------------------------------------------------------
  # Final gate — passes only if every binding agreed with the corpus AND the
  # fixture re-emit was byte-identical. Branch protection should require this
  # check on the main branch.
  # ---------------------------------------------------------------------------
  conformance-summary:
    name: Conformance summary (required check)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    needs:
      - fixture-parity
      - ts-conformance
      - rust-conformance
      - py-conformance
      - kmp-conformance
    steps:
      - name: All bindings passed
        run: echo "Smritidb conformance gate green across all bindings."
