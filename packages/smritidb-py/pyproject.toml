[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "smritidb"
version = "0.1.0"
description = "Python bindings for Smritidb binary HDC associative memory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tanvrit Private Limited", email = "ervivek40@gmail.com" },
]
keywords = [
    "hyperdimensional",
    "associative-memory",
    "vector-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://tanvrit.com/smritidb"
Documentation = "https://docs.tanvrit.com/smritidb/python"
Repository = "https://github.com/Tanvrit/smritidb"
Issues = "https://github.com/Tanvrit/smritidb/issues"

[tool.maturin]
python-source = "python"
module-name = "smritidb._native"
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
strip = true
