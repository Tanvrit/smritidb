# cbindgen configuration for the smritidb-c crate.
#
# Run from packages/smritidb-c/:
#   cbindgen --config cbindgen.toml --crate smritidb-c --output include/smritidb.h
#
# The generated header is the source of truth for Go/Dart/.NET bindings.

language = "C"
header = """/*
 * smritidb.h — stable C ABI for the Smritidb associative store.
 *
 * Generated by cbindgen. Do not edit by hand; regenerate via:
 *
 *   cbindgen --config cbindgen.toml --crate smritidb-c --output include/smritidb.h
 *
 * Memory ownership:
 *  - Pointers returned via `out_*` parameters or directly are owned by the
 *    caller and MUST be released via the matching `smritidb_free_*` helper.
 *  - The opaque `SmritidbStore*` handle is freed exclusively via
 *    `smritidb_close`.
 *  - Strings returned by `smritidb_last_error` are owned by the library and
 *    valid until the next call into smritidb on the same thread.
 *
 * Error model:
 *  - Functions that can fail return a non-zero int status code, or NULL for
 *    pointer-returning functions. Call `smritidb_last_error()` to fetch a
 *    human-readable diagnostic for the current thread.
 */
"""
include_guard = "SMRITIDB_H"
pragma_once = true
autogen_warning = "/* WARNING: this file is generated by cbindgen. Do not edit by hand. */"
include_version = true
cpp_compat = true
documentation = true
style = "type"

[parse]
parse_deps = false

[export]
prefix = ""
include = ["SmritidbStore", "SmritidbMatch", "SmritidbBytes", "SmritidbStatus"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
