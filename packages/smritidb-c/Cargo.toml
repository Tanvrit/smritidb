[package]
name = "smritidb-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Smritidb C ABI — stable extern \"C\" surface over smritidb-core, consumed by Go, Dart, and .NET bindings."
authors = ["Tanvrit Private Limited <ervivek40@gmail.com>"]
homepage = "https://kanervalabs.com"
repository = "https://github.com/kanervalabs/smritidb"
documentation = "https://docs.rs/smritidb-c"
readme = "README.md"
keywords = ["hyperdimensional", "associative-memory", "vector-database", "binary-hdc", "kanerva"]
categories = ["data-structures", "database"]
publish = false

[lib]
name = "smritidb_c"
# cdylib for Go/Dart/.NET dynamic loading (.so/.dylib/.dll).
# staticlib for callers that prefer a fully static link (.a).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
smritidb-core = { path = "../core-rs", version = "0.1.0" }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
cbindgen = { version = "0.29", optional = true }

[features]
# Optional: regenerate include/smritidb.h on build. Off by default so the
# checked-in header is the source of truth; enable when bumping the C ABI.
generate-header = ["dep:cbindgen"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
