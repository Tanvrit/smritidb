# Required so the targets can share a Cinterop klib through an
# intermediate source set. Without this, Kotlin/Native refuses to
# expose the cinterop'd `smritidb_ffi` namespace to `ffiNativeMain`
# and asks for it to be enabled.
kotlin.mpp.enableCInteropCommonization=true

# We define the source-set hierarchy explicitly in `build.gradle.kts`
# (`ffiNativeMain` parents both Apple and Android Native; `nativeMain`
# only parents Linux). Disabling the default template avoids the
# Kotlin plugin warning that explicit `dependsOn` calls collide with
# the auto-created `appleMain` / `nativeMain` parents.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Silence the deprecation warning for the (default) Kotlin compiler
# warning level — keeps the test output focused on real failures.
org.gradle.warning.mode=summary
