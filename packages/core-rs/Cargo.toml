[package]
name = "smritidb-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Smritidb core — binary hyperdimensional computing primitives, KMF wire format, and the associative Store. Native + WebAssembly."
authors = ["Tanvrit Private Limited <ervivek40@gmail.com>"]
homepage = "https://tanvrit.com"
repository = "https://github.com/Tanvrit/smritidb"
documentation = "https://docs.rs/smritidb-core"
readme = "README.md"
keywords = ["hyperdimensional", "associative-memory", "vector-database", "binary-hdc", "kanerva"]
categories = ["data-structures", "database"]
rust-version = "1.75"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is required so JSON objects round-trip in insertion order —
# the KMF wire format is JSON-encoded and must be byte-identical with the
# TypeScript reference, which inherits JS's insertion-order semantics.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"

# UUIDv7 — used by the Store for item ids. Time-ordered, RFC 9562.
uuid = { version = "1", features = ["v7"] }

# WebAssembly bindings — gated behind the `wasm` feature so native Rust users
# don't pay the wasm-bindgen cost.
wasm-bindgen = { version = "0.2", optional = true }
# Used by `wasm.rs` to convert Rust types into rich `JsValue`s without a
# manual stringify dance. Optional / wasm-only.
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
# Routes Rust panics into `console.error` instead of the opaque
# `RuntimeError: unreachable` browsers / Node otherwise surface. Lights
# up only on the wasm build.
console_error_panic_hook = { version = "0.1", optional = true }

# SQLite persistence adapter — bundled libsqlite3 so we have no system
# dependency. Gated behind a feature flag because rusqlite does not build on
# the `wasm32-unknown-unknown` target.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# `getrandom` is a transitive dep of `uuid`; on `wasm32-unknown-unknown` the
# crate refuses to build unless a randomness backend is selected. Picking
# the `js` feature wires it into `crypto.getRandomValues()` in the host
# environment (browser / Node 17+). `uuid`'s `js` feature flips the same
# switch for the uuid crate itself. We pin both via a target-specific
# block so native builds keep their lean dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v7", "js"] }

[features]
default = ["persist-sqlite"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]
persist-sqlite = ["dep:rusqlite"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "primitives"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# `wasm-pack` ships its own pinned `wasm-opt`. Rust 1.95's LLVM emits
# bulk-memory ops (memory.copy / memory.fill) by default, which the
# pinned `wasm-opt` rejects with `Bulk memory operations require
# bulk memory [--enable-bulk-memory]`. Disable the optimiser pass —
# `cargo build --release` already runs LLVM's own optimiser at -O3,
# so we lose only the post-processing dead-code shrink.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
