[package]
name = "smritidb-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Smritidb FFI bindings via UniFFI — generates Kotlin and Swift surfaces over the Rust core."
authors = ["Tanvrit Private Limited <ervivek40@gmail.com>"]
homepage = "https://tanvrit.com"
repository = "https://github.com/Tanvrit/smritidb"
documentation = "https://docs.rs/smritidb-ffi"
readme = "README.md"
keywords = ["hyperdimensional", "associative-memory", "vector-database", "binary-hdc", "kanerva"]
categories = ["data-structures", "database"]
publish = false

[lib]
name = "smritidb_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
parking_lot = "0.12"
thiserror = "1.0"
serde_json = { version = "1", features = ["preserve_order"] }
smritidb-core = { path = "../core-rs", version = "0.1.0" }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
