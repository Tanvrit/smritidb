name: smritidb
description: >-
  Dart/Flutter binding for Smritidb binary HDC associative memory. Backed by
  the packages/smritidb-c shared library via dart:ffi.
version: 0.1.0
homepage: https://tanvrit.com/smritidb
repository: https://github.com/Tanvrit/smritidb
issue_tracker: https://github.com/Tanvrit/smritidb/issues
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  test: ^1.33.0
  lints: ^6.1.0
